[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-sam"
version = "0.1.0"
description = "Private AI agent operating system skeleton."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
  "langgraph>=0.2,<1.0",
  "litellm>=1.52,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<6.0",
  "qdrant-client>=1.12,<2.0",
  "python-telegram-bot>=21.6,<22.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "app",
  "agent",
  "db",
  "gateways",
  "workers",
  "tools"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[project.scripts]
agent-sam-api = "app.main:run"
agent-sam-doctor = "scripts.doctor:run"
agent-sam-gateways = "gateways.runner:run"
agent-sam-run = "scripts.run:run"
agent-sam-setup = "scripts.setup:run"
agent-sam-worker = "workers.main:run"
agent-sam-cli = "gateways.cli.main:run"
agent-sam-telegram = "gateways.telegram.main:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
